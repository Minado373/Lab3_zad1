<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form class="country">
      <label class="country__label" for="regions"> Wybierz region: </label>
      <select name="regions" id="regions" class="regions">
        <option value="Africa">Africa</option>
        <option value="Americas">Americas</option>
        <option value="Asia">Asia</option>
        <option value="Europe">Europe</option>
        <option value="Oceania">Oceania</option>
      </select>
      <button class="country__button" id="countryButton">Pobierz dane</button>
    </form>
    <p id="resultMessage">Brak wyników</p>
    <table id="table">
      <thead id="tableHead">
        <th>Name</th>
        <th>Capital</th>
        <th>Population</th>
        <th>Subregion</th>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="loader" id="loader">
      <p>Loading...</p>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
